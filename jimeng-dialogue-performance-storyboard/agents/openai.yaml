interface:
  display_name: "即梦可拍漫剧分镜"
  short_description: "用具象机位、实体光影与自然表演构建有感染力的连续 Seedance 分镜"
  default_prompt: "使用 $jimeng-dialogue-performance-storyboard，在剧情与台词保真的前提下，按目标、策略、关系、危险判断和现实认知判断每个节拍的观看职责，再决定叙事锚点、表达性冲击和叙事结果；L0-L3只用于内部推理，不输出标签，也不套固定镜头数量、景别比例或运镜配额。景别机位优先写具名人物/环境/物体、景别、高低机位与正侧方向，不强制依附门、桌或家具；一个镜头固定一个景别或最多只做一次 A 到 B 的景别变化，环绕只改变路径和观察方向。用前中后景、实体光路和单一主运镜建立画面，只冻结刺激、主动作、关键接触与落幅以保留自然演绎空间；只合并没有独立观看职责的镜头，不为减镜数压平反转，也不为通过校验堆特写或短镜；正常生成只执行硬错误校验，不读取创作诊断统计；维护逐场道具账本并准确交接最终状态；输出感染力强、动作连续的八字段 Seedance 2.5 分镜。"
