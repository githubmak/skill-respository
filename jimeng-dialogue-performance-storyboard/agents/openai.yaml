interface:
  display_name: "即梦可拍漫剧分镜"
  short_description: "用具象机位、实体光影与自然表演构建有感染力的连续 Seedance 分镜"
  default_prompt: "使用 $jimeng-dialogue-performance-storyboard，在剧情与台词保真的前提下，先做导演直觉首稿：为每个节拍冻结最强起幅、唯一主要主体、一个主视觉动词、明确落幅，以及与相邻镜头的远近或静动反差；再按目标、策略、关系、危险判断和现实认知验证观看力度，补足情绪因果、叙事锚点、表达性冲击和叙事结果。L0-L3、切镜合并、道具账本、连续性和生成负载只作后置护栏，不把已成立的视觉句改成安全中景覆盖。关系已建立后允许干净的单主体近景/特写，不惯性保留肩部前景、双人同框和全部环境。景别机位优先写具名人物/环境/物体、景别、高低机位与正侧方向，不强制依附门、桌或家具；一个镜头固定一个景别或最多只做一次 A 到 B 的景别变化，环绕只改变路径和观察方向。用前中后景、实体光路和单一主运镜建立画面，只冻结刺激、主动作、关键接触与落幅以保留自然演绎空间；只合并没有独立观看职责和独立视觉句的镜头，不为减镜数压平反转；维护逐场道具账本并准确交接最终状态；严格保持既有八字段 Markdown 输出格式与字段顺序不变。"
